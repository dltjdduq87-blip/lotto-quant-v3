[project]
name = "lotto-quant-v3"
version = "3.0.0"
description = "LOTTO 6/45 quantitative analysis: probability, portfolio optimization, Monte Carlo, walk-forward backtest, and a Streamlit dashboard with a live draw play mode."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "requests",
    "beautifulsoup4",
    "openpyxl",
    "plotly",
    "streamlit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
